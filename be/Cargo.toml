[package]
name = "be"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Reliable, interoperable file encryption using the age v1 format"

[dependencies]
age = { version = "0.12.1", default-features = false }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
same-file = "1.0.6"
tempfile = "3.21"

[dev-dependencies]
proptest = "1.7"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
